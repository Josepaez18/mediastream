# =============================================================================
# Pipeline CI/CD común a todos los microservicios (sección 7 del documento).
#
#   1. Trigger        → lo define cada workflow de servicio (push a main/develop,
#                       Pull Request hacia develop, o manual).
#   2. Dependencias   → npm ci (Node.js) / pip install -r requirements (Python).
#   3. Lint           → ESLint (Node.js) / Flake8 (Python).
#   4. Tests          → unitarios + integración contra un PostgreSQL real.
#                       (2–4 y el escaneo de secretos con gitleaks vienen de
#                       ci-servicio.yml, el mismo CI que usan los repos de servicio.)
#   5. Build Docker   → imagen del servicio desde su propio Dockerfile.
#   6. Push registry  → GitHub Container Registry, etiquetada con el SHA.
#   7. Deploy Render  → API de Render (POST /services/{id}/deploys) con ESA imagen (sin reconstruir).
#
# Si el lint, los tests o el escaneo de secretos fallan, el pipeline se corta
# ahí: no se construye ni se despliega nada (el "punto de corte" de la figura
# del documento). En Pull Requests solo corren los pasos 2–4.
#
# Recibe solo los tres secretos de Render que necesita el deploy, nombrados
# uno por uno por cada workflow de servicio (nada de `secrets: inherit`).
# =============================================================================
name: Pipeline de un microservicio

on:
  workflow_call:
    inputs:
      service:
        description: Carpeta del microservicio (p. ej. user-service)
        required: true
        type: string
      runtime:
        description: node | python
        required: true
        type: string
      secret_suffix:
        description: Sufijo de los secretos RENDER_*_<sufijo> (USER, CATALOG, …), para los mensajes
        required: true
        type: string
      database:
        description: Base de datos para las pruebas de integración
        required: false
        type: string
        default: ci_db
      postgres_image:
        description: Imagen de PostgreSQL para las pruebas de integración
        required: false
        type: string
        default: postgres:16-alpine
      prisma:
        description: El servicio usa Prisma (false en los que no tienen base relacional)
        required: false
        type: boolean
        default: true
      ffmpeg:
        description: Instalar FFmpeg para las pruebas (Media-Processing)
        required: false
        type: boolean
        default: false
    secrets:
      render_api_key:
        description: API key de Render (solo la usa el job de deploy)
        required: false
      render_service_id:
        description: ID del Web Service de producción en Render (rama main)
        required: false
      render_staging_service_id:
        description: ID del Web Service de staging en Render (rama develop)
        required: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci-servicio.yml
    permissions:
      contents: read
    with:
      runtime: ${{ inputs.runtime }}
      directorio: ${{ inputs.service }}
      base_datos: ${{ inputs.database }}
      postgres_image: ${{ inputs.postgres_image }}
      prisma: ${{ inputs.prisma }}
      # Como antes: los servicios Node sin Prisma (Notification, Gateway) compilan TypeScript.
      build: ${{ !inputs.prisma }}
      ffmpeg: ${{ inputs.ffmpeg }}

  imagen:
    name: Build Docker y push a GHCR
    needs: ci
    # Solo en push/manual sobre main (producción) o develop (staging).
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.nombre.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Nombre de la imagen
        id: nombre
        # ghcr.io exige el dueño del repositorio en minúsculas.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mediastream-${{ inputs.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar la imagen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ inputs.service }}
          push: true
          # SHA del commit (para desplegar y hacer rollback) + nombre de la rama.
          tags: |
            ${{ steps.nombre.outputs.image }}:${{ github.sha }}
            ${{ steps.nombre.outputs.image }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

  deploy:
    name: Deploy a Render
    needs: imagen
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # Los servicios se crearon vía Blueprint + API de Render (no hay deploy
      # hooks por dashboard en este setup), así que el deploy se dispara con
      # la API de Render: POST /services/{id}/deploys con la imagen exacta.
      - name: Disparar deploy en Render con la imagen ${{ github.sha }}
        env:
          RENDER_API_KEY: ${{ secrets.render_api_key }}
          PROD_SERVICE_ID: ${{ secrets.render_service_id }}
          STAGING_SERVICE_ID: ${{ secrets.render_staging_service_id }}
          IMAGE: ${{ needs.imagen.outputs.image }}:${{ github.sha }}
          SERVICE: ${{ inputs.service }}
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            TARGET_ID="$PROD_SERVICE_ID"; SECRET="RENDER_SERVICE_ID_${{ inputs.secret_suffix }}"; ENTORNO="producción"
          else
            TARGET_ID="$STAGING_SERVICE_ID"; SECRET="RENDER_STAGING_SERVICE_ID_${{ inputs.secret_suffix }}"; ENTORNO="staging"
          fi
          if [ -z "$TARGET_ID" ] || [ -z "$RENDER_API_KEY" ]; then
            echo "::notice title=Deploy omitido::Falta RENDER_API_KEY o el secreto $SECRET: la imagen quedó publicada pero no se desplegó $SERVICE en $ENTORNO."
            exit 0
          fi
          curl -fsS -X POST "https://api.render.com/v1/services/${TARGET_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"imageUrl\": \"${IMAGE}\"}" -o /dev/null
          echo "Deploy de $SERVICE en $ENTORNO solicitado con la imagen $IMAGE" | tee -a "$GITHUB_STEP_SUMMARY"
