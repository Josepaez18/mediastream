# Catalog-Service: lint → tests → imagen Docker → GHCR → Render.
# Solo corre cuando cambia algo de este microservicio (sección 7: "tests del
# servicio modificado"). También se puede lanzar a mano desde la pestaña Actions.
name: Catalog-Service

on:
  push:
    branches: [main, develop]
    paths:
      - "catalog-service/**"
      - ".github/workflows/catalog-service.yml"
      - ".github/workflows/_pipeline-servicio.yml"
  pull_request:
    branches: [develop]
    paths:
      - "catalog-service/**"
      - ".github/workflows/catalog-service.yml"
      - ".github/workflows/_pipeline-servicio.yml"
  workflow_dispatch:

concurrency:
  group: catalog-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    uses: ./.github/workflows/_pipeline-servicio.yml
    permissions:
      contents: read
      packages: write
    with:
      service: catalog-service
      runtime: node
      secret_suffix: CATALOG
      database: catalog_db
    secrets: inherit
