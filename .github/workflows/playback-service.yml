# Playback-Service: lint → tests → imagen Docker → GHCR → Render.
# Solo corre cuando cambia algo de este microservicio (sección 7: "tests del
# servicio modificado"). También se puede lanzar a mano desde la pestaña Actions.
name: Playback-Service

on:
  push:
    branches: [main, develop]
    paths:
      - "playback-service/**"
      - ".github/workflows/playback-service.yml"
      - ".github/workflows/_pipeline-servicio.yml"
      - ".github/workflows/ci-servicio.yml"
  pull_request:
    branches: [develop]
    paths:
      - "playback-service/**"
      - ".github/workflows/playback-service.yml"
      - ".github/workflows/_pipeline-servicio.yml"
      - ".github/workflows/ci-servicio.yml"
  workflow_dispatch:

concurrency:
  group: playback-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    uses: ./.github/workflows/_pipeline-servicio.yml
    permissions:
      contents: read
      packages: write
    with:
      service: playback-service
      runtime: node
      secret_suffix: PLAYBACK
      database: playback_db
    secrets:
      render_api_key: ${{ secrets.RENDER_API_KEY }}
      render_service_id: ${{ secrets.RENDER_SERVICE_ID_PLAYBACK }}
      render_staging_service_id: ${{ secrets.RENDER_STAGING_SERVICE_ID_PLAYBACK }}
