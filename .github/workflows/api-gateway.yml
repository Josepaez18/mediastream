# API-Gateway: lint → tests → imagen Docker → GHCR → Render.
# Solo corre cuando cambia algo de este microservicio (sección 7: "tests del
# servicio modificado"). También se puede lanzar a mano desde la pestaña Actions.
name: API-Gateway

on:
  push:
    branches: [main, develop]
    paths:
      - "api-gateway/**"
      - ".github/workflows/api-gateway.yml"
      - ".github/workflows/_pipeline-servicio.yml"
      - ".github/workflows/ci-servicio.yml"
  pull_request:
    branches: [develop]
    paths:
      - "api-gateway/**"
      - ".github/workflows/api-gateway.yml"
      - ".github/workflows/_pipeline-servicio.yml"
      - ".github/workflows/ci-servicio.yml"
  workflow_dispatch:

concurrency:
  group: api-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    uses: ./.github/workflows/_pipeline-servicio.yml
    permissions:
      contents: read
      packages: write
    with:
      service: api-gateway
      runtime: node
      secret_suffix: GATEWAY
      prisma: false
    secrets:
      render_api_key: ${{ secrets.RENDER_API_KEY }}
      render_service_id: ${{ secrets.RENDER_SERVICE_ID_GATEWAY }}
      render_staging_service_id: ${{ secrets.RENDER_STAGING_SERVICE_ID_GATEWAY }}
