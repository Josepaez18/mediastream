# Notification-Service: lint → tests → imagen Docker → GHCR → Render.
# Solo corre cuando cambia algo de este microservicio (sección 7: "tests del
# servicio modificado"). También se puede lanzar a mano desde la pestaña Actions.
name: Notification-Service

on:
  push:
    branches: [main, develop]
    paths:
      - "notification-service/**"
      - ".github/workflows/notification-service.yml"
      - ".github/workflows/_pipeline-servicio.yml"
  pull_request:
    branches: [develop]
    paths:
      - "notification-service/**"
      - ".github/workflows/notification-service.yml"
      - ".github/workflows/_pipeline-servicio.yml"
  workflow_dispatch:

concurrency:
  group: notification-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    uses: ./.github/workflows/_pipeline-servicio.yml
    permissions:
      contents: read
      packages: write
    with:
      service: notification-service
      runtime: node
      secret_suffix: NOTIFICATION
      prisma: false
    secrets: inherit
