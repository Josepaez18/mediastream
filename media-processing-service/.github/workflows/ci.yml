# Integración continua de este microservicio: lint, pruebas y escaneo de
# secretos en cada push y Pull Request. Los pasos están en un único workflow
# reutilizable del repositorio de la plataforma, el mismo que corre antes de
# construir la imagen y desplegar en Render:
# https://github.com/Josepaez18/mediastream/blob/v1/.github/workflows/ci-servicio.yml
# Aquí solo se indica qué necesita este servicio. No usa ningún secreto.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: Josepaez18/mediastream/.github/workflows/ci-servicio.yml@v1
    with:
      runtime: python
      ffmpeg: true
