# Integración continua de este microservicio: lint, pruebas y escaneo de
# secretos en cada Pull Request y en push a develop. En main las mismas
# pruebas corren dentro de cd.yml, antes de construir la imagen y desplegar.
# Los pasos están en un único workflow reutilizable del repositorio de la
# plataforma:
# https://github.com/Josepaez18/mediastream/blob/v1/.github/workflows/ci-servicio.yml
# Aquí solo se indica qué necesita este servicio. No usa ningún secreto.
name: CI

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: Josepaez18/mediastream/.github/workflows/ci-servicio.yml@v1
    with:
      runtime: python
      ffmpeg: true
