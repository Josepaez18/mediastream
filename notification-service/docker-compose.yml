# Stack de desarrollo AISLADO de Notification-Service.
#
# Levanta el servicio solo, con su Redis y su RabbitMQ. No tiene base de
# datos relacional: Redis es su almacenamiento (deduplicación + historial).
# Para levantar TODA la plataforma junta, usa el docker-compose.yml de la
# carpeta padre.
#
# Sin Catalog-Service los avisos salen con un texto genérico ("Título #3").

services:
  notification-redis:
    image: redis:7-alpine
    container_name: notification-redis
    restart: unless-stopped
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mediastream-net

  notification-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: notification-rabbitmq
    restart: unless-stopped
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - mediastream-net

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notification-service
    restart: unless-stopped
    ports:
      - "3007:3007"
    environment:
      PORT: 3007
      REDIS_URL: "redis://notification-redis:6379"
      RABBITMQ_URL: "amqp://guest:guest@notification-rabbitmq:5672"
      CATALOG_SERVICE_URL: "http://catalog-service:3002"
      CORS_ORIGINS: "*"
    depends_on:
      notification-redis:
        condition: service_healthy
      notification-rabbitmq:
        condition: service_healthy
    networks:
      - mediastream-net

networks:
  mediastream-net:
    name: mediastream-net
    driver: bridge
